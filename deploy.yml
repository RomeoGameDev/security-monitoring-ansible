---
- name: Deploy Wazuh, SOCFortress, Zabbix and Nginx Proxy Manager
  hosts: docker_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - >-
            (
              ansible_facts["distribution"] == "Ubuntu"
              and ansible_facts["distribution_version"] is version("24.04", ">=")
            )
            or
            (
              ansible_facts["distribution"] == "Debian"
              and ansible_facts["distribution_major_version"] | int >= 13
            )
        fail_msg: >-
          Obsługiwane systemy to Ubuntu 24.04+ oraz Debian 13+.
          Wykryto {{ ansible_facts["distribution"] }}
          {{ ansible_facts["distribution_version"] }}.

    - name: Validate database passwords
      ansible.builtin.assert:
        that:
          - item.value is not match('^CHANGE_ME')
          - item.value is match('^[A-Za-z0-9_.@!#%+=:-]{1,128}$')
        fail_msg: >-
          Ustaw {{ item.name }} w group_vars/all.yml.
          Hasło może mieć 1-128 znaków. Znaki specjalne nie są wymagane.
          Obsługiwane są litery, cyfry oraz _ . @ ! # % + = : -
      loop:
        - name: shared_database_root_password
          value: "{{ shared_database_root_password }}"
        - name: npm_database_password
          value: "{{ npm_database_password }}"
        - name: zabbix_database_password
          value: "{{ zabbix_database_password }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Validate Nginx Proxy Manager admin password
      ansible.builtin.assert:
        that:
          - npm_admin_password is not match('^CHANGE_ME')
          - npm_admin_password | string | length >= 8
          - npm_admin_password | string | length <= 64
        fail_msg: >-
          Ustaw npm_admin_password w group_vars/all.yml.
          Nginx Proxy Manager wymaga hasła o długości 8-64 znaków,
          ale nie wymaga cyfr ani znaków specjalnych.
      no_log: true

    - name: Resolve storage mode
      ansible.builtin.set_fact:
        security_monitoring_data_root_effective: >-
          {{ security_monitoring_data_root | default('/opt') | regex_replace('/+$', '') }}
        security_monitoring_bind_persistent_data_effective: >-
          {{ security_monitoring_bind_persistent_data | default(false) | bool }}

    - name: Validate storage root
      ansible.builtin.assert:
        that:
          - security_monitoring_data_root_effective is match('^/.+')
          - security_monitoring_data_root_effective != '/'
        fail_msg: >-
          security_monitoring_data_root musi być bezwzględną ścieżką inną niż /.
          Przykład: /opt albo /data/security-monitoring.

    - name: Resolve deployment directories
      ansible.builtin.set_fact:
        shared_database_directory_effective: >-
          {{ shared_database_directory | default(security_monitoring_data_root_effective ~ '/shared-database') }}
        npm_directory_effective: >-
          {{ npm_directory | default(security_monitoring_data_root_effective ~ '/nginx-proxy-manager') }}
        wazuh_directory_effective: >-
          {{ wazuh_directory | default(security_monitoring_data_root_effective ~ '/wazuh') }}
        wazuh_persistent_directory_effective: >-
          {{ wazuh_persistent_directory | default(security_monitoring_data_root_effective ~ '/wazuh-persistent') }}
        socfortress_directory_effective: >-
          {{ socfortress_directory | default(security_monitoring_data_root_effective ~ '/wazuh-socfortress') }}
        zabbix_directory_effective: >-
          {{ zabbix_directory | default(security_monitoring_data_root_effective ~ '/zabbix') }}

    - name: Set deployment facts
      ansible.builtin.set_fact:
        deployment_ip: "{{ ansible_facts['default_ipv4']['address'] }}"
        docker_repository_os: "{{ ansible_facts['distribution'] | lower }}"
        docker_repository_arch: >-
          {{
            {
              'x86_64': 'amd64',
              'aarch64': 'arm64',
              'armv7l': 'armhf'
            }.get(ansible_facts['architecture'], ansible_facts['architecture'])
          }}
        zabbix_repository_os: "{{ ansible_facts['distribution'] | lower }}"
        zabbix_repository_version: >-
          {{
            ansible_facts['distribution_version']
            if ansible_facts['distribution'] == 'Ubuntu'
            else ansible_facts['distribution_major_version']
          }}

    - name: Resolve optional NPM TLS settings
      ansible.builtin.set_fact:
        npm_self_signed_enabled_effective: "{{ npm_self_signed_enabled | default(true) | bool }}"
        npm_self_signed_days_effective: "{{ npm_self_signed_days | default(3650) | int }}"
        npm_force_ssl_effective: "{{ npm_force_ssl | default(false) | bool }}"
        npm_self_signed_certificate_directory_effective: >-
          {{ npm_self_signed_certificate_directory | default(npm_directory_effective ~ '/certificates') }}

    - name: Build Zabbix repository package URL
      ansible.builtin.set_fact:
        zabbix_repository_package_url: >-
          https://repo.zabbix.com/zabbix/7.0/{{ zabbix_repository_os }}/pool/main/z/zabbix-release/zabbix-release_latest_7.0+{{ zabbix_repository_os }}{{ zabbix_repository_version }}_all.deb

    - name: Show deployment target
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "IP: {{ deployment_ip }}"
          - "System: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "Katalog danych: {{ security_monitoring_data_root_effective }}"
          - >-
            {{
              'Trwałe dane: katalogi hosta pod wybraną ścieżką'
              if security_monitoring_bind_persistent_data_effective
              else 'Trwałe dane: nazwane wolumeny Dockera (tryb zgodności)'
            }}
          - "Wazuh: http://{{ deployment_ip }}/wazuh/"
          - "Zabbix: http://{{ deployment_ip }}/zabbix/"
          - >-
            {{
              'HTTPS self-signed: https://' ~ deployment_ip ~ '/wazuh/ oraz /zabbix/'
              if npm_self_signed_enabled_effective
              else 'HTTPS self-signed: wyłączony'
            }}

  tasks:
    ####################################################################
    # HOST
    ####################################################################

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
          - python3
          - python3-requests
          - openssl
          - rsync
          - unzip
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Read service facts
      ansible.builtin.service_facts:

    - name: Stop conflicting host web services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - nginx.service
        - apache2.service
      when:
        - disable_conflicting_web_services | bool
        - item in ansible_facts.services

    ####################################################################
    # DOCKER
    ####################################################################

    - name: Remove conflicting Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent

    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Remove legacy Docker repository file
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Download Docker repository signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_repository_os }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
        force: true

    - name: Configure Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris:
          - "https://download.docker.com/linux/{{ docker_repository_os }}"
        suites:
          - "{{ ansible_facts['distribution_release'] }}"
        components:
          - stable
        architectures:
          - "{{ docker_repository_arch }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
      register: docker_repository

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: "{{ docker_repository.changed }}"

    - name: Enable Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Add deployment user to Docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups:
          - docker
        append: true

    - name: Configure vm.max_map_count
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: "262144"
        sysctl_set: true
        state: present
        reload: true

    - name: Create shared Docker networks
      community.docker.docker_network:
        name: "{{ item }}"
        state: present
      loop:
        - "{{ docker_proxy_network }}"
        - "{{ docker_database_network }}"

    - name: Create security monitoring data root
      ansible.builtin.file:
        path: "{{ security_monitoring_data_root_effective }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Create bind-mounted persistent data directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ shared_database_directory_effective }}/data", owner: root, group: root, mode: "0750" }
        - { path: "{{ npm_directory_effective }}/data", owner: root, group: root, mode: "0750" }
        - { path: "{{ npm_directory_effective }}/letsencrypt", owner: root, group: root, mode: "0750" }
        - { path: "{{ zabbix_directory_effective }}/data/alertscripts", owner: '1997', group: '0', mode: "0770" }
        - { path: "{{ zabbix_directory_effective }}/data/externalscripts", owner: '1997', group: '0', mode: "0770" }
        - { path: "{{ zabbix_directory_effective }}/data/modules", owner: '1997', group: '0', mode: "0770" }
        - { path: "{{ zabbix_directory_effective }}/data/enc", owner: '1997', group: '0', mode: "0770" }
        - { path: "{{ zabbix_directory_effective }}/data/ssh_keys", owner: '1997', group: '0', mode: "0770" }
        - { path: "{{ zabbix_directory_effective }}/data/ssl/certs", owner: '1997', group: '0', mode: "0770" }
        - { path: "{{ zabbix_directory_effective }}/data/ssl/keys", owner: '1997', group: '0', mode: "0770" }
        - { path: "{{ zabbix_directory_effective }}/data/ssl/ssl_ca", owner: '1997', group: '0', mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/manager/api-configuration", owner: root, group: root, mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/manager/etc", owner: root, group: root, mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/manager/logs", owner: root, group: root, mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/manager/queue", owner: root, group: root, mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/manager/var-multigroups", owner: root, group: root, mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/manager/integrations", owner: root, group: root, mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/manager/active-response", owner: root, group: root, mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/manager/agentless", owner: root, group: root, mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/manager/wodles", owner: root, group: root, mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/manager/filebeat-etc", owner: root, group: root, mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/manager/filebeat-var", owner: root, group: root, mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/indexer", owner: '1000', group: '1000', mode: "0750" }
        - { path: "{{ wazuh_persistent_directory_effective }}/dashboard/config", owner: '1000', group: '1000', mode: "0770" }
        - { path: "{{ wazuh_persistent_directory_effective }}/dashboard/custom", owner: '1000', group: '1000', mode: "0770" }
      when: security_monitoring_bind_persistent_data_effective
      loop_control:
        label: "{{ item.path }}"

    ####################################################################
    # SHARED MARIADB
    ####################################################################

    - name: Create shared database directory
      ansible.builtin.file:
        path: "{{ shared_database_directory_effective }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Create shared database environment
      ansible.builtin.template:
        src: shared-db.env.j2
        dest: "{{ shared_database_directory_effective }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Create shared database configuration
      ansible.builtin.template:
        src: shared-db.cnf.j2
        dest: "{{ shared_database_directory_effective }}/99-shared-database.cnf"
        owner: root
        group: root
        mode: "0644"

    - name: Create shared database Compose file
      ansible.builtin.template:
        src: shared-db-compose.yml.j2
        dest: "{{ shared_database_directory_effective }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0640"

    - name: Create database bootstrap SQL
      ansible.builtin.template:
        src: shared-db-bootstrap.sql.j2
        dest: "{{ shared_database_directory_effective }}/bootstrap.sql"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Validate shared database Compose file
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ shared_database_directory_effective }}"
      changed_when: false

    - name: Start shared database
      community.docker.docker_compose_v2:
        project_src: "{{ shared_database_directory_effective }}"
        state: present
        pull: always
        remove_orphans: true
        wait: true
        wait_timeout: 300

    - name: Bootstrap NPM and Zabbix databases
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          docker cp "{{ shared_database_directory_effective }}/bootstrap.sql" shared-db:/tmp/bootstrap.sql
          docker exec \
            -e MYSQL_PWD="{{ shared_database_root_password }}" \
            shared-db \
            sh -c 'mariadb -uroot < /tmp/bootstrap.sql'
          docker exec shared-db rm -f /tmp/bootstrap.sql
        executable: /bin/bash
      changed_when: true
      no_log: true

    - name: Verify log_bin_trust_function_creators
      ansible.builtin.command:
        cmd: >-
          docker exec
          -e MYSQL_PWD={{ shared_database_root_password }}
          shared-db
          mariadb -uroot -Nse
          "SELECT @@GLOBAL.log_bin_trust_function_creators;"
      register: shared_database_function_creators
      changed_when: false
      failed_when:
        - shared_database_function_creators.rc != 0
          or shared_database_function_creators.stdout | trim != "1"
      no_log: true

    - name: Remove database bootstrap SQL from host
      ansible.builtin.file:
        path: "{{ shared_database_directory_effective }}/bootstrap.sql"
        state: absent

    ####################################################################
    # NGINX PROXY MANAGER
    ####################################################################

    - name: Remove legacy proxy and database containers
      ansible.builtin.command:
        cmd: docker rm -f {{ item }}
      loop:
        - path-gateway
        - nginx-proxy-manager-db
        - zabbix-db
      changed_when: false
      failed_when: false

    - name: Remove legacy path gateway directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/path-gateway
        - "{{ security_monitoring_data_root_effective }}/path-gateway"

    - name: Create Nginx Proxy Manager directory
      ansible.builtin.file:
        path: "{{ npm_directory_effective }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Create Nginx Proxy Manager default host directory
      ansible.builtin.file:
        path: "{{ npm_directory_effective }}/default-host"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Remove managed default HTTPS virtual host before NPM start when disabled
      ansible.builtin.file:
        path: "{{ npm_directory_effective }}/default-host/site.conf"
        state: absent
      when: not npm_self_signed_enabled_effective
      register: npm_default_https_removed

    - name: Create Nginx Proxy Manager environment
      ansible.builtin.template:
        src: npm.env.j2
        dest: "{{ npm_directory_effective }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Create Nginx Proxy Manager Compose file
      ansible.builtin.template:
        src: npm-compose.yml.j2
        dest: "{{ npm_directory_effective }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0640"

    - name: Validate Nginx Proxy Manager Compose file
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ npm_directory_effective }}"
      changed_when: false

    - name: Start Nginx Proxy Manager
      community.docker.docker_compose_v2:
        project_src: "{{ npm_directory_effective }}"
        state: present
        pull: always
        remove_orphans: true
        wait: false

    - name: Wait for Nginx Proxy Manager API
      ansible.builtin.uri:
        url: http://127.0.0.1:81/api/
        status_code:
          - 200
          - 401
        return_content: false
      register: npm_api_check
      retries: 60
      delay: 5
      until: npm_api_check.status in [200, 401]

    - name: Validate Nginx Proxy Manager configuration after disabling managed HTTPS
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - nginx-proxy-manager
          - nginx
          - -t
      changed_when: false
      when:
        - not npm_self_signed_enabled_effective
        - npm_default_https_removed.changed

    - name: Reload Nginx Proxy Manager after disabling managed HTTPS
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - nginx-proxy-manager
          - nginx
          - -s
          - reload
      when:
        - not npm_self_signed_enabled_effective
        - npm_default_https_removed.changed

    - name: Create self-signed certificate directory
      ansible.builtin.file:
        path: "{{ npm_self_signed_certificate_directory_effective }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: npm_self_signed_enabled_effective

    - name: Check self-signed certificate
      ansible.builtin.stat:
        path: "{{ npm_self_signed_certificate_directory_effective }}/monitoring-{{ deployment_ip }}.crt"
      register: npm_self_signed_certificate
      when: npm_self_signed_enabled_effective

    - name: Check self-signed private key
      ansible.builtin.stat:
        path: "{{ npm_self_signed_certificate_directory_effective }}/monitoring-{{ deployment_ip }}.key"
      register: npm_self_signed_key
      when: npm_self_signed_enabled_effective

    - name: Remove incomplete self-signed certificate pair
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ npm_self_signed_certificate_directory_effective }}/monitoring-{{ deployment_ip }}.crt"
        - "{{ npm_self_signed_certificate_directory_effective }}/monitoring-{{ deployment_ip }}.key"
      when:
        - npm_self_signed_enabled_effective
        - not npm_self_signed_certificate.stat.exists or not npm_self_signed_key.stat.exists

    - name: Generate self-signed certificate for deployment IP
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -nodes
          - -newkey
          - rsa:2048
          - -sha256
          - -days
          - "{{ npm_self_signed_days_effective | string }}"
          - -keyout
          - "{{ npm_self_signed_certificate_directory_effective }}/monitoring-{{ deployment_ip }}.key"
          - -out
          - "{{ npm_self_signed_certificate_directory_effective }}/monitoring-{{ deployment_ip }}.crt"
          - -subj
          - "/CN={{ deployment_ip }}"
          - -addext
          - "subjectAltName=IP:{{ deployment_ip }}"
      when:
        - npm_self_signed_enabled_effective
        - not npm_self_signed_certificate.stat.exists or not npm_self_signed_key.stat.exists
      no_log: true

    - name: Set self-signed certificate permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ npm_self_signed_certificate_directory_effective }}/monitoring-{{ deployment_ip }}.crt"
          mode: "0644"
        - path: "{{ npm_self_signed_certificate_directory_effective }}/monitoring-{{ deployment_ip }}.key"
          mode: "0600"
      when: npm_self_signed_enabled_effective

    - name: Create default HTTPS virtual host for direct IP access
      ansible.builtin.template:
        src: npm-default-https.conf.j2
        dest: "{{ npm_directory_effective }}/default-host/site.conf"
        owner: root
        group: root
        mode: "0644"
      when: npm_self_signed_enabled_effective
      register: npm_default_https_config

    - name: Validate Nginx Proxy Manager configuration after default HTTPS change
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - nginx-proxy-manager
          - nginx
          - -t
      changed_when: false
      when:
        - npm_self_signed_enabled_effective
        - npm_default_https_config.changed

    - name: Reload Nginx Proxy Manager after default HTTPS change
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - nginx-proxy-manager
          - nginx
          - -s
          - reload
      when:
        - npm_self_signed_enabled_effective
        - npm_default_https_config.changed

    ####################################################################
    # WAZUH
    ####################################################################

    - name: Clone Wazuh Docker repository
      ansible.builtin.git:
        repo: "{{ wazuh_docker_repository }}"
        dest: "{{ wazuh_directory_effective }}"
        version: "{{ wazuh_docker_version }}"
        depth: 1
        force: true
        update: true

    - name: Create persistent Wazuh Dashboard directory
      ansible.builtin.file:
        path: "{{ wazuh_persistent_directory_effective }}/dashboard"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Check persistent Wazuh Dashboard application configuration
      ansible.builtin.stat:
        path: "{{ wazuh_persistent_directory_effective }}/dashboard/wazuh.yml"
      register: persistent_wazuh_dashboard_config

    - name: Seed persistent Wazuh Dashboard application configuration
      ansible.builtin.copy:
        src: "{{ wazuh_directory_effective }}/single-node/config/wazuh_dashboard/wazuh.yml"
        dest: "{{ wazuh_persistent_directory_effective }}/dashboard/wazuh.yml"
        remote_src: true
        owner: root
        group: root
        mode: "0660"
      when: not persistent_wazuh_dashboard_config.stat.exists

    - name: Configure Wazuh Dashboard base path
      ansible.builtin.lineinfile:
        path: "{{ wazuh_directory_effective }}/single-node/config/wazuh_dashboard/opensearch_dashboards.yml"
        regexp: "^{{ item.key | regex_escape }}:"
        line: "{{ item.key }}: {{ item.value }}"
        insertafter: EOF
      loop:
        - key: server.basePath
          value: '"/wazuh"'
        - key: server.rewriteBasePath
          value: "true"
        - key: server.ssl.enabled
          value: "false"
        - key: opensearch_security.cookie.secure
          value: "false"
      loop_control:
        label: "{{ item.key }}"

    - name: Remove published Wazuh Dashboard web port
      ansible.builtin.replace:
        path: "{{ wazuh_directory_effective }}/single-node/docker-compose.yml"
        regexp: '(?m)^    ports:\n      -\s*"?[^"\n]*:5601"?\s*\n'
        replace: ''

    - name: Bind Wazuh Indexer port to localhost
      ansible.builtin.lineinfile:
        path: "{{ wazuh_directory_effective }}/single-node/docker-compose.yml"
        regexp: '^\s*-\s*"9200:9200"\s*$'
        line: '      - "127.0.0.1:9200:9200"'

    - name: Create Wazuh proxy override
      ansible.builtin.template:
        src: wazuh-proxy-compose.yml.j2
        dest: "{{ wazuh_directory_effective }}/single-node/docker-compose.proxy.yml"
        owner: root
        group: root
        mode: "0640"

    - name: Validate Wazuh Compose configuration
      ansible.builtin.command:
        cmd: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.proxy.yml
          config --quiet
        chdir: "{{ wazuh_directory_effective }}/single-node"
      changed_when: false

    - name: Pull Wazuh Manager image for bind-data initialization
      community.docker.docker_image:
        name: "wazuh/wazuh-manager:{{ wazuh_docker_version | regex_replace('^v', '') }}"
        source: pull
      when: security_monitoring_bind_persistent_data_effective

    - name: Check Wazuh Manager bind-data initialization marker
      ansible.builtin.stat:
        path: "{{ wazuh_persistent_directory_effective }}/.manager-bind-data-v7-initialized"
      register: wazuh_manager_bind_data_marker
      when: security_monitoring_bind_persistent_data_effective

    - name: Seed Wazuh Manager bind-mounted directories from image
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          seed_container="security-monitoring-wazuh-manager-seed"
          image="wazuh/wazuh-manager:{{ wazuh_docker_version | regex_replace('^v', '') }}"

          cleanup() {
            docker rm -f "$seed_container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          docker create --name "$seed_container" "$image" >/dev/null

          seed_directory() {
            source_path="$1"
            destination_path="$2"
            if ! find "$destination_path" -mindepth 1 -print -quit | grep -q .; then
              docker cp -a "$seed_container:$source_path/." "$destination_path/"
            fi
          }

          seed_directory /var/ossec/api/configuration "{{ wazuh_persistent_directory_effective }}/manager/api-configuration"
          seed_directory /var/ossec/etc "{{ wazuh_persistent_directory_effective }}/manager/etc"
          seed_directory /var/ossec/logs "{{ wazuh_persistent_directory_effective }}/manager/logs"
          seed_directory /var/ossec/queue "{{ wazuh_persistent_directory_effective }}/manager/queue"
          seed_directory /var/ossec/var/multigroups "{{ wazuh_persistent_directory_effective }}/manager/var-multigroups"
          seed_directory /var/ossec/integrations "{{ wazuh_persistent_directory_effective }}/manager/integrations"
          seed_directory /var/ossec/active-response/bin "{{ wazuh_persistent_directory_effective }}/manager/active-response"
          seed_directory /var/ossec/agentless "{{ wazuh_persistent_directory_effective }}/manager/agentless"
          seed_directory /var/ossec/wodles "{{ wazuh_persistent_directory_effective }}/manager/wodles"
          seed_directory /etc/filebeat "{{ wazuh_persistent_directory_effective }}/manager/filebeat-etc"
          seed_directory /var/lib/filebeat "{{ wazuh_persistent_directory_effective }}/manager/filebeat-var"
        executable: /bin/bash
      when:
        - security_monitoring_bind_persistent_data_effective
        - not wazuh_manager_bind_data_marker.stat.exists
      changed_when: true

    - name: Create Wazuh Manager bind-data initialization marker
      ansible.builtin.copy:
        dest: "{{ wazuh_persistent_directory_effective }}/.manager-bind-data-v7-initialized"
        content: "wazuh-manager {{ wazuh_docker_version }}\n"
        owner: root
        group: root
        mode: "0600"
      when:
        - security_monitoring_bind_persistent_data_effective
        - not wazuh_manager_bind_data_marker.stat.exists

    - name: Check Wazuh certificates
      ansible.builtin.stat:
        path: "{{ wazuh_directory_effective }}/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem"
      register: wazuh_root_ca

    - name: Generate Wazuh certificates
      ansible.builtin.command:
        cmd: docker compose -f generate-indexer-certs.yml run --rm generator
        chdir: "{{ wazuh_directory_effective }}/single-node"
      when: not wazuh_root_ca.stat.exists
      changed_when: true

    - name: Start Wazuh
      community.docker.docker_compose_v2:
        project_src: "{{ wazuh_directory_effective }}/single-node"
        files:
          - docker-compose.yml
          - docker-compose.proxy.yml
        state: present
        pull: always
        remove_orphans: true
        wait: false

    - name: Wait for Wazuh manager and dashboard containers
      ansible.builtin.command:
        cmd: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.proxy.yml
          ps --status running --services
        chdir: "{{ wazuh_directory_effective }}/single-node"
      register: wazuh_running_services
      retries: 60
      delay: 5
      until:
        - "'wazuh.manager' in wazuh_running_services.stdout_lines"
        - "'wazuh.dashboard' in wazuh_running_services.stdout_lines"
      changed_when: false

    - name: Make Wazuh Dashboard application configuration writable
      ansible.builtin.command:
        cmd: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.proxy.yml
          exec -T -u 0 wazuh.dashboard
          sh -c '
          owner="$(stat -c "%u:%g" /usr/share/wazuh-dashboard/data/wazuh/config)" &&
          chown "$owner" /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml &&
          chmod 660 /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
          '
        chdir: "{{ wazuh_directory_effective }}/single-node"
      changed_when: true

    ####################################################################
    # SOCFORTRESS
    ####################################################################

    - name: Create SOCFortress directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ socfortress_directory_effective }}"
        - "{{ socfortress_directory_effective }}/repository"
        - "{{ socfortress_directory_effective }}/rules"
        - "{{ socfortress_directory_effective }}/decoders"
      when: socfortress_rules_enabled | bool

    - name: Clone SOCFortress repository
      ansible.builtin.git:
        repo: "{{ socfortress_repository }}"
        dest: "{{ socfortress_directory_effective }}/repository"
        version: "{{ socfortress_repository_version }}"
        force: true
        update: true
      when: socfortress_rules_enabled | bool

    - name: Check duplicate SOCFortress XML filenames
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          find "{{ socfortress_directory_effective }}/repository" -type f -name '*.xml' -printf '%f\n' \
            | sort | uniq -d
        executable: /bin/bash
      register: socfortress_duplicate_files
      changed_when: false
      failed_when: socfortress_duplicate_files.stdout | length > 0
      when: socfortress_rules_enabled | bool

    - name: Prepare SOCFortress rules and decoders
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail

          repo="{{ socfortress_directory_effective }}/repository"
          rules="{{ socfortress_directory_effective }}/rules"
          decoders="{{ socfortress_directory_effective }}/decoders"

          rm -f "$rules"/*.xml "$decoders"/*.xml

          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              decoder-linux-sysmon.xml|yara_decoders.xml|auditd_decoders.xml|naxsi-opnsense_decoders.xml|maltrail_decoders.xml|decoder-manager-logs.xml)
                install -m 0644 "$file" "$decoders/$name"
                ;;
              *)
                install -m 0644 "$file" "$rules/$name"
                ;;
            esac
          done < <(find "$repo" -type f -name '*.xml' -print0)

          sed -i \
            's#<if_sid>100535</if_sid>#<if_sid>100534</if_sid>#' \
            "$rules/100535-win_powershell_rules.xml"

          sed -i \
            's/sysmon_event_7/sysmon_event7/g' \
            "$rules/900000-exclusion_rules.xml"

          find "$rules" -maxdepth 1 -type f -name '*.xml' -printf '%f\n' | sort \
            > "{{ socfortress_directory_effective }}/socfortress-rules.manifest"
          find "$decoders" -maxdepth 1 -type f -name '*.xml' -printf '%f\n' | sort \
            > "{{ socfortress_directory_effective }}/socfortress-decoders.manifest"
        executable: /bin/bash
      changed_when: true
      when: socfortress_rules_enabled | bool

    - name: Synchronize SOCFortress rules
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          container="single-node-wazuh.manager-1"
          manifest="/var/ossec/etc/.socfortress-rules.manifest"

          docker exec "$container" sh -c '
            manifest="/var/ossec/etc/.socfortress-rules.manifest"
            if [ -f "$manifest" ]; then
              while IFS= read -r name; do
                [ -n "$name" ] && rm -f "/var/ossec/etc/rules/$name"
              done < "$manifest"
            fi
          '

          docker cp "{{ socfortress_directory_effective }}/rules/." \
            "$container:/var/ossec/etc/rules/"
          docker cp "{{ socfortress_directory_effective }}/socfortress-rules.manifest" \
            "$container:$manifest"
        executable: /bin/bash
      changed_when: true
      when: socfortress_rules_enabled | bool

    - name: Synchronize SOCFortress decoders
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          container="single-node-wazuh.manager-1"
          manifest="/var/ossec/etc/.socfortress-decoders.manifest"

          docker exec "$container" sh -c '
            manifest="/var/ossec/etc/.socfortress-decoders.manifest"
            if [ -f "$manifest" ]; then
              while IFS= read -r name; do
                [ -n "$name" ] && rm -f "/var/ossec/etc/decoders/$name"
              done < "$manifest"
            fi
          '

          docker cp "{{ socfortress_directory_effective }}/decoders/." \
            "$container:/var/ossec/etc/decoders/"
          docker cp "{{ socfortress_directory_effective }}/socfortress-decoders.manifest" \
            "$container:$manifest"
        executable: /bin/bash
      changed_when: true
      when: socfortress_rules_enabled | bool

    ####################################################################
    # CUSTOM WAZUH RULES AND DECODERS
    ####################################################################

    - name: Ensure custom Wazuh source directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      loop:
        - "{{ custom_wazuh_rules_source }}"
        - "{{ custom_wazuh_decoders_source }}"

    - name: Build custom Wazuh manifests
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          find "{{ custom_wazuh_rules_source }}" -maxdepth 1 -type f -name '*.xml' -printf '%f\n' | sort \
            > /tmp/custom-wazuh-rules.manifest
          find "{{ custom_wazuh_decoders_source }}" -maxdepth 1 -type f -name '*.xml' -printf '%f\n' | sort \
            > /tmp/custom-wazuh-decoders.manifest
        executable: /bin/bash
      changed_when: false

    - name: Synchronize custom Wazuh rules
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          container="single-node-wazuh.manager-1"
          manifest="/var/ossec/etc/.custom-rules.manifest"

          docker exec "$container" sh -c '
            manifest="/var/ossec/etc/.custom-rules.manifest"
            if [ -f "$manifest" ]; then
              while IFS= read -r name; do
                [ -n "$name" ] && rm -f "/var/ossec/etc/rules/$name"
              done < "$manifest"
            fi
          '

          if find "{{ custom_wazuh_rules_source }}" -maxdepth 1 -type f -name '*.xml' | grep -q .; then
            docker cp "{{ custom_wazuh_rules_source }}/." \
              "$container:/var/ossec/etc/rules/"
          fi
          docker cp /tmp/custom-wazuh-rules.manifest "$container:$manifest"
        executable: /bin/bash
      changed_when: true

    - name: Synchronize custom Wazuh decoders
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          container="single-node-wazuh.manager-1"
          manifest="/var/ossec/etc/.custom-decoders.manifest"

          docker exec "$container" sh -c '
            manifest="/var/ossec/etc/.custom-decoders.manifest"
            if [ -f "$manifest" ]; then
              while IFS= read -r name; do
                [ -n "$name" ] && rm -f "/var/ossec/etc/decoders/$name"
              done < "$manifest"
            fi
          '

          if find "{{ custom_wazuh_decoders_source }}" -maxdepth 1 -type f -name '*.xml' | grep -q .; then
            docker cp "{{ custom_wazuh_decoders_source }}/." \
              "$container:/var/ossec/etc/decoders/"
          fi
          docker cp /tmp/custom-wazuh-decoders.manifest "$container:$manifest"
        executable: /bin/bash
      changed_when: true

    - name: Set Wazuh rules and decoders permissions
      ansible.builtin.command:
        cmd: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.proxy.yml
          exec -T -u 0 wazuh.manager
          sh -c '
          find /var/ossec/etc/rules -maxdepth 1 -type f -name "*.xml"
          -exec chown wazuh:wazuh {} \; &&
          find /var/ossec/etc/rules -maxdepth 1 -type f -name "*.xml"
          -exec chmod 660 {} \; &&
          find /var/ossec/etc/decoders -maxdepth 1 -type f -name "*.xml"
          -exec chown wazuh:wazuh {} \; &&
          find /var/ossec/etc/decoders -maxdepth 1 -type f -name "*.xml"
          -exec chmod 660 {} \;
          '
        chdir: "{{ wazuh_directory_effective }}/single-node"
      changed_when: true

    - name: Validate Wazuh rules and decoders
      ansible.builtin.command:
        cmd: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.proxy.yml
          exec -T wazuh.manager
          /var/ossec/bin/wazuh-analysisd -t
        chdir: "{{ wazuh_directory_effective }}/single-node"
      changed_when: false

    - name: Restart Wazuh manager
      ansible.builtin.command:
        cmd: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.proxy.yml
          restart wazuh.manager
        chdir: "{{ wazuh_directory_effective }}/single-node"
      changed_when: true

    - name: Wait for Wazuh manager after restart
      ansible.builtin.command:
        cmd: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.proxy.yml
          ps --status running --services
        chdir: "{{ wazuh_directory_effective }}/single-node"
      register: wazuh_services_after_restart
      retries: 60
      delay: 5
      until: "'wazuh.manager' in wazuh_services_after_restart.stdout_lines"
      changed_when: false

    - name: Validate Wazuh after restart
      ansible.builtin.command:
        cmd: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.proxy.yml
          exec -T wazuh.manager
          /var/ossec/bin/wazuh-analysisd -t
        chdir: "{{ wazuh_directory_effective }}/single-node"
      changed_when: false

    ####################################################################
    # ZABBIX SERVER AND WEB
    ####################################################################

    - name: Create Zabbix directory
      ansible.builtin.file:
        path: "{{ zabbix_directory_effective }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Create Zabbix environment file
      ansible.builtin.template:
        src: zabbix.env.j2
        dest: "{{ zabbix_directory_effective }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Create Zabbix Compose file
      ansible.builtin.template:
        src: zabbix-compose.yml.j2
        dest: "{{ zabbix_directory_effective }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0640"

    - name: Validate Zabbix Compose file
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ zabbix_directory_effective }}"
      changed_when: false

    - name: Start Zabbix stack
      ansible.builtin.command:
        cmd: docker compose up -d --pull always --remove-orphans
        chdir: "{{ zabbix_directory_effective }}"
      changed_when: true

    - name: Wait for Zabbix web container
      ansible.builtin.command:
        cmd: >-
          docker inspect
          --format '{{ '{{' }}.State.Health.Status{{ '}}' }}'
          zabbix-web-nginx
      register: zabbix_web_health
      retries: 90
      delay: 5
      until: zabbix_web_health.stdout | trim == "healthy"
      changed_when: false

    ####################################################################
    # ZABBIX AGENT 2 ON HOST
    ####################################################################

    - name: Download Zabbix repository package
      ansible.builtin.get_url:
        url: "{{ zabbix_repository_package_url }}"
        dest: /tmp/zabbix-release-7.0.deb
        owner: root
        group: root
        mode: "0644"
        force: true
      when: zabbix_agent2_enabled | bool

    - name: Install Zabbix repository package
      ansible.builtin.apt:
        deb: /tmp/zabbix-release-7.0.deb
        state: present
      when: zabbix_agent2_enabled | bool

    - name: Install Zabbix Agent 2
      ansible.builtin.apt:
        name: zabbix-agent2
        state: present
        update_cache: true
      when: zabbix_agent2_enabled | bool

    - name: Configure Zabbix Agent 2
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: "^#?{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - key: Server
          value: "{{ zabbix_agent_allowed_servers }}"
        - key: ServerActive
          value: "{{ zabbix_agent_server_address }}"
        - key: Hostname
          value: "{{ zabbix_agent_hostname }}"
        - key: ListenIP
          value: 0.0.0.0
        - key: ListenPort
          value: "{{ zabbix_agent_listen_port }}"
        - key: HostMetadata
          value: "{{ zabbix_agent_host_metadata }}"
      loop_control:
        label: "{{ item.key }}"
      when: zabbix_agent2_enabled | bool

    - name: Configure Zabbix Agent 2 Docker plugin
      ansible.builtin.template:
        src: zabbix-agent2-docker.conf.j2
        dest: /etc/zabbix/zabbix_agent2.d/docker.conf
        owner: root
        group: zabbix
        mode: "0640"
      when:
        - zabbix_agent2_enabled | bool
        - zabbix_agent_monitor_docker | bool

    - name: Add Zabbix user to Docker group
      ansible.builtin.user:
        name: zabbix
        groups:
          - docker
        append: true
      when:
        - zabbix_agent2_enabled | bool
        - zabbix_agent_monitor_docker | bool

    - name: Enable and restart Zabbix Agent 2
      ansible.builtin.systemd_service:
        name: zabbix-agent2
        enabled: true
        state: restarted
      when: zabbix_agent2_enabled | bool

    - name: Verify Zabbix Agent 2 service
      ansible.builtin.command:
        cmd: systemctl is-active zabbix-agent2
      register: zabbix_agent_status
      changed_when: false
      failed_when: zabbix_agent_status.stdout | trim != "active"
      when: zabbix_agent2_enabled | bool

    ####################################################################
    # NPM IP ROUTING
    ####################################################################

    - name: Remove obsolete NPM routing markers
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ npm_directory_effective }}/.ip-routing-v5-provisioned"
        - "{{ npm_directory_effective }}/.ip-routing-v6-provisioned"

    - name: Create NPM IP routing provisioner
      ansible.builtin.template:
        src: npm-provision.py.j2
        dest: "{{ npm_directory_effective }}/provision-ip-routing.py"
        owner: root
        group: root
        mode: "0700"
      no_log: true

    - name: Provision IP routing in Nginx Proxy Manager
      ansible.builtin.command:
        cmd: "{{ npm_directory_effective }}/provision-ip-routing.py"
      register: npm_routing_result
      changed_when: >-
        (npm_routing_result.stdout | from_json).action in ['created', 'updated']

    - name: Remove NPM routing provisioner containing credentials
      ansible.builtin.file:
        path: "{{ npm_directory_effective }}/provision-ip-routing.py"
        state: absent

    ####################################################################
    # INITIAL ZABBIX HOST INTERFACE
    ####################################################################

    - name: Check Zabbix interface provisioning marker
      ansible.builtin.stat:
        path: "{{ zabbix_directory_effective }}/.default-agent-interface-v5-provisioned"
      register: zabbix_interface_marker

    - name: Try login to Zabbix API for initial interface provisioning
      ansible.builtin.uri:
        url: http://127.0.0.1/zabbix/api_jsonrpc.php
        method: POST
        body_format: json
        headers:
          Host: "{{ deployment_ip }}"
          Content-Type: application/json-rpc
        body:
          jsonrpc: "2.0"
          method: user.login
          params:
            username: "{{ zabbix_initial_admin_user }}"
            password: "{{ zabbix_initial_admin_password }}"
          id: 1
        status_code: 200
      register: zabbix_login
      failed_when: false
      when: not zabbix_interface_marker.stat.exists
      no_log: true

    - name: Read default Zabbix host interface
      ansible.builtin.uri:
        url: http://127.0.0.1/zabbix/api_jsonrpc.php
        method: POST
        body_format: json
        headers:
          Host: "{{ deployment_ip }}"
          Content-Type: application/json-rpc
        body:
          jsonrpc: "2.0"
          method: host.get
          params:
            filter:
              host:
                - "{{ zabbix_agent_hostname }}"
            selectInterfaces:
              - interfaceid
              - ip
              - dns
              - useip
              - port
          auth: "{{ zabbix_login.json.result }}"
          id: 2
        status_code: 200
      register: zabbix_default_host
      failed_when: false
      when:
        - not zabbix_interface_marker.stat.exists
        - zabbix_login.json is defined
        - zabbix_login.json.result is defined
      no_log: true

    - name: Set default Zabbix interface identifier
      ansible.builtin.set_fact:
        zabbix_default_interface_id: >-
          {{ (zabbix_default_host.json.result[0].interfaces | first).interfaceid }}
      when:
        - not zabbix_interface_marker.stat.exists
        - zabbix_default_host.json is defined
        - zabbix_default_host.json.result is defined
        - zabbix_default_host.json.result | length > 0
        - zabbix_default_host.json.result[0].interfaces | length > 0

    - name: Configure default Zabbix host to reach Agent 2 on VM address
      ansible.builtin.uri:
        url: http://127.0.0.1/zabbix/api_jsonrpc.php
        method: POST
        body_format: json
        headers:
          Host: "{{ deployment_ip }}"
          Content-Type: application/json-rpc
        body:
          jsonrpc: "2.0"
          method: hostinterface.update
          params:
            interfaceid: "{{ zabbix_default_interface_id }}"
            useip: 1
            ip: "{{ deployment_ip }}"
            dns: ""
            port: "{{ zabbix_agent_listen_port }}"
          auth: "{{ zabbix_login.json.result }}"
          id: 3
        status_code: 200
      register: zabbix_interface_update
      failed_when: false
      when:
        - not zabbix_interface_marker.stat.exists
        - zabbix_default_interface_id is defined
      no_log: true

    - name: Create Zabbix interface provisioning marker
      ansible.builtin.copy:
        dest: "{{ zabbix_directory_effective }}/.default-agent-interface-v5-provisioned"
        content: "{{ deployment_ip }}:{{ zabbix_agent_listen_port }}\n"
        owner: root
        group: root
        mode: "0600"
      when:
        - not zabbix_interface_marker.stat.exists
        - zabbix_interface_update.json is defined
        - zabbix_interface_update.json.result is defined

    - name: Show Zabbix Agent interface reminder
      ansible.builtin.debug:
        msg: >-
          Sprawdź w Zabbix Web: Data collection -> Hosts -> Zabbix server -> Interfaces.
          Ustaw {{ deployment_ip }}:{{ zabbix_agent_listen_port }}.
          Adres 127.0.0.1 wskazuje kontener Zabbix Server i nie połączy się z Agentem 2 na hoście.

    ####################################################################
    # VERIFICATION
    ####################################################################

    - name: Wait for Wazuh through Nginx Proxy Manager
      ansible.builtin.uri:
        url: "http://127.0.0.1/wazuh/"
        headers:
          Host: "{{ deployment_ip }}"
        status_code:
          - 200
          - 302
          - 401
        return_content: false
      register: wazuh_npm_check
      retries: 90
      delay: 10
      until: wazuh_npm_check.status in [200, 302, 401]

    - name: Wait for Zabbix through Nginx Proxy Manager
      ansible.builtin.uri:
        url: "http://127.0.0.1/zabbix/"
        headers:
          Host: "{{ deployment_ip }}"
        status_code:
          - 200
          - 301
          - 302
        return_content: false
      register: zabbix_npm_check
      retries: 90
      delay: 10
      until: zabbix_npm_check.status in [200, 301, 302]

    - name: Wait for Wazuh HTTPS through Nginx Proxy Manager
      ansible.builtin.uri:
        url: "https://{{ deployment_ip }}/wazuh/"
        status_code:
          - 200
          - 302
          - 401
        validate_certs: false
        return_content: false
      register: wazuh_npm_https_check
      retries: 30
      delay: 5
      until: wazuh_npm_https_check.status in [200, 302, 401]
      when: npm_self_signed_enabled_effective

    - name: Wait for Zabbix HTTPS through Nginx Proxy Manager
      ansible.builtin.uri:
        url: "https://{{ deployment_ip }}/zabbix/"
        status_code:
          - 200
          - 301
          - 302
        validate_certs: false
        return_content: false
      register: zabbix_npm_https_check
      retries: 30
      delay: 5
      until: zabbix_npm_https_check.status in [200, 301, 302]
      when: npm_self_signed_enabled_effective

    - name: Read running containers
      ansible.builtin.command:
        cmd: docker ps --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}"
      register: docker_ps_result
      changed_when: false

    - name: Show deployment summary
      ansible.builtin.debug:
        msg:
          - "Wdrożenie zakończone."
          - "Katalog danych: {{ security_monitoring_data_root_effective }}"
          - "Wazuh HTTP: http://{{ deployment_ip }}/wazuh/"
          - "Zabbix HTTP: http://{{ deployment_ip }}/zabbix/"
          - >-
            {{
              'Wazuh HTTPS: https://' ~ deployment_ip ~ '/wazuh/ (self-signed)'
              if npm_self_signed_enabled_effective
              else 'Wazuh HTTPS self-signed: wyłączony'
            }}
          - >-
            {{
              'Zabbix HTTPS: https://' ~ deployment_ip ~ '/zabbix/ (self-signed)'
              if npm_self_signed_enabled_effective
              else 'Zabbix HTTPS self-signed: wyłączony'
            }}
          - "Nginx Proxy Manager: http://{{ deployment_ip }}:81"
          - "NPM login: {{ npm_admin_email }}"
          - "Wazuh agent events: {{ deployment_ip }}:1514"
          - "Wazuh enrollment: {{ deployment_ip }}:1515"
          - "Wazuh API: https://{{ deployment_ip }}:55000"
          - "Zabbix server: {{ deployment_ip }}:10051"
          - "Zabbix Agent 2: {{ deployment_ip }}:{{ zabbix_agent_listen_port }}"
          - "WAŻNE: w Data collection -> Hosts -> Zabbix server -> Interfaces ustaw {{ deployment_ip }}:{{ zabbix_agent_listen_port }}. Adres 127.0.0.1 wskazuje kontener Zabbix Server i nie zadziała."
          - "{{ docker_ps_result.stdout }}"
